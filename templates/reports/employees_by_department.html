{% extends "base.html" %}
{% block content %}
<h2>Employees by Department</h2>
<table class="miu-table"><thead><tr><th>Department</th><th>Employee Count</th></tr></thead><tbody>
{% for d in data %}<tr><td>{{ d.name }}</td><td>{{ d.employee_count }}</td></tr>{% empty %}<tr><td colspan="2">No data.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
