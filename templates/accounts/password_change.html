{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <h2>Change Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.old_password }}
    {{ form.new_password1 }}
    {{ form.new_password2 }}
    <button type="submit" class="btn btn-primary">Update Password</button>
  </form>
</div>
{% endblock %}
