{% extends "base.html" %}
{% block title %}{% if mode == "create" %}New Employee{% else %}Edit Employee{% endif %}{% endblock %}
{% block content %}
<h2>{% if mode == "create" %}New Employee{% else %}Edit Employee{% endif %}</h2>
<div class="card" style="max-width:640px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
