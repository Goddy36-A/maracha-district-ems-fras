{% extends "base.html" %}
{% block content %}
<h2>Deactivate {{ employee.full_name }}?</h2>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Confirm Deactivate</button>
  <a class="btn btn-outline" href="{% url 'employees:detail' employee.pk %}">Cancel</a>
</form>
{% endblock %}
