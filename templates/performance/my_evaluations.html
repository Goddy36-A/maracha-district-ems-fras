{% extends "base.html" %}
{% block title %}My Performance{% endblock %}
{% block content %}
<h2>My Performance Evaluations</h2>
<table class="miu-table">
  <thead><tr><th>Cycle</th><th>Stage</th><th>Score</th><th></th></tr></thead>
  <tbody>
    {% for e in evaluations %}
    <tr><td>{{ e.cycle }}</td><td>{{ e.get_stage_display }}</td><td>{{ e.final_score|default:"—" }}</td><td><a href="{% url 'performance:detail' e.pk %}">View</a></td></tr>
    {% empty %}<tr><td colspan="4">No evaluations yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
