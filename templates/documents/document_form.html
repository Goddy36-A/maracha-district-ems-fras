{% extends "base.html" %}
{% block content %}
<h2>Upload Employee Document</h2>
<div class="card" style="max-width:480px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Upload</button>
  </form>
</div>
{% endblock %}
